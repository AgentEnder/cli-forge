# WARNING: This workflow can be run on forks, so it is important to not perform any sensitive operations
# or expose any secrets.
#
# pkg.pr.new as a registry is not the source of truth for the packages, npm is, so even if somehow a
# malicious actor were able to leverage this workflow to publish malware, nobody would receive it
# automatically, they would have to install a super specific URL.

name: Publish PR branch to pkg.pr.new

run-name: Publish PR branch to pkg.pr.new for PR ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted]

# Minimal permissions by default
permissions:
  contents: read
  pull-requests: write

env:
  NX_NO_CLOUD: true
  NX_CLOUD_ACCESS_TOKEN: ''

jobs:
  publish_pr_branch_to_pkg_pr_new:
    name: Publish PR branch to pkg.pr.new
    if: github.actor == 'AgentEnder' && github.event.review.state == 'commented' && contains(github.event.review.body, '@preview publish')
    runs-on: ubuntu-latest
    steps:
      - name: React with eyes to review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // React directly to the triggering review via GraphQL using its node_id
            const reviewNodeId = '${{ github.event.review.node_id }}';
            await github.graphql(`
              mutation($subjectId: ID!) {
                addReaction(input: {subjectId: $subjectId, content: EYES}) {
                  reaction { content }
                }
              }
            `, { subjectId: reviewNodeId });
            core.exportVariable('REVIEW_NODE_ID', reviewNodeId);

      - name: Print review comment SHA
        run: echo "${{ github.event.review.commit_id }}"

      - name: Print pull request URL
        run: echo "${{ github.event.pull_request.html_url }}"

      # Check out the PR branch HEAD as a shallow clone
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Disable caching given this workflow could be run on forks (security risk)
          cache: ''

      - name: Check PR branch HEAD has not changed since review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ github.event.pull_request.number }};
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = response.data.head.sha;
            console.log(`The latest commit SHA on PR #${prNumber} is ${headSha}`);
            if (headSha !== '${{ github.event.review.commit_id }}') {
              throw new Error('PR branch HEAD has changed since the triggering review comment was made')
            }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Build packages
        run: pnpm nx run-many -t build

      - name: Publish PR branch to pkg.pr.new
        run: pnpm dlx pkg-pr-new publish --pnpm --compact --peerDeps --no-template --comment=update './packages/*'

      - name: React with rocket to review comment
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewNodeId = process.env.REVIEW_NODE_ID;
            if (reviewNodeId) {
              await github.graphql(`
                mutation($subjectId: ID!) {
                  addReaction(input: {subjectId: $subjectId, content: ROCKET}) {
                    reaction { content }
                  }
                }
              `, { subjectId: reviewNodeId });
            }

  preview_docs:
    name: Deploy docs preview
    if: github.actor == 'AgentEnder' && github.event.review.state == 'commented' && contains(github.event.review.body, '@preview docs')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: React with eyes to review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
            });
            const triggerComment = comments.reverse().find(c => c.body?.includes('@preview docs'));
            if (triggerComment) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: triggerComment.id,
                content: 'eyes',
              });
              core.exportVariable('TRIGGER_COMMENT_ID', triggerComment.id);
            }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Build docs preview
        run: pnpm nx build docs-site
        env:
          PREVIEW_PATH: pr/${{ github.event.pull_request.number }}
          BASE_URL: /cli-forge/pr/${{ github.event.pull_request.number }}

      - name: Deploy preview to gh-pages
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PREVIEW_DIR="pr/${PR_NUMBER}"

          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-repo

          rm -rf "gh-pages-repo/${PREVIEW_DIR}"
          mkdir -p "gh-pages-repo/${PREVIEW_DIR}"
          cp -r docs-site/dist/client/* "gh-pages-repo/${PREVIEW_DIR}/"

          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy docs preview for PR #${PR_NUMBER}" --allow-empty
          git push origin gh-pages

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const previewUrl = `https://craigory.dev/cli-forge/pr/${prNumber}/`;
            const marker = '<!-- docs-preview-comment -->';
            const body = `${marker}\n**Docs Preview:** ${previewUrl}\n\nDeployed commit: ${shortSha} (${sha})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: React with check to review comment
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentId = process.env.TRIGGER_COMMENT_ID;
            if (commentId) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(commentId),
                content: 'rocket',
              });
            }
