id: multi-command-cli
title: Multi-Command CLI Structure
description: |
  Shows how to organize a CLI with multiple commands in separate files
  using `makeComposableBuilder` and `chain` for fully typed composition.

  Key features demonstrated:
  - Commands defined in separate files using `makeComposableBuilder`
  - Type-safe composition with `chain` (no `as any` needed)
  - Typed handler return values (BuildResult, ServerInfo, etc.)
  - Parent handler accessing children via `getChildren()` with full types

entryPoint: cli.ts
fileMap:
  "./cli.ts": "cli.ts"
  "./commands/init.ts": "commands/init.ts"
  "./commands/build.ts": "commands/build.ts"
  "./commands/serve.ts": "commands/serve.ts"

commands:
  - command: "{filename} init --name my-project"
    title: "Initialize Project"
    assertions:
      - contains: "Initializing project: my-project"

  - command: "{filename} build --minify"
    title: "Build with Minification"
    assertions:
      - contains: "Building project"
      - contains: "minify: true"

  - command: "{filename} serve --port 4000 --open"
    title: "Start Dev Server"
    assertions:
      - contains: "Starting server on port 4000"
      - contains: "Opening browser"
