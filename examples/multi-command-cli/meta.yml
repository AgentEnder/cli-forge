id: multi-command-cli
title: Multi-Command CLI Structure
description: |
  Organize a CLI with multiple commands in separate files using
  `makeComposableBuilder` and `chain`. Each command returns typed
  results that can be accessed programmatically via `getChildren()`.

test:
  - name: "Initialize Project"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json cli.ts init --name my-project'
    assertions:
      stdout:
        contains: "Initializing project: my-project"

  - name: "Build with Minification"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json cli.ts build --minify'
    assertions:
      stdout:
        matches: 'Building project.*minify: true'

  - name: "Start Dev Server"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json cli.ts serve --port 4000 --open'
    assertions:
      stdout:
        matches: 'Starting server on port 4000.*Opening browser'
