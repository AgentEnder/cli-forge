id: middleware-composition
title: Middleware Composition
description: |
  Demonstrates how to compose middleware from separate modules. Each middleware
  adds properties to the args object, and TypeScript correctly infers the
  accumulated type in the final handler.
test:
  - name: "With Authentication"
    options:
      command: 'npx tsx --no-cache --tsconfig ./examples/tsconfig.json examples/middleware-composition/cli.ts greet --name Developer'
    assertions:
      stdout:
        matches: '(?s)Hello, Developer.*authenticated.*Request completed in'
