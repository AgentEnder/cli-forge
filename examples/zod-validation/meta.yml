id: zod-validation
title: Zod Schema Validation
description: |
  Demonstrates how to use Zod schemas for argument validation and transformation.
  Schemas are defined in separate files, making them reusable across commands
  and testable in isolation.

entryPoint: ./cli.ts
fileMap:
  './cli.ts': 'cli.ts'
  './schemas/config.ts': 'schemas/config.ts'
  './schemas/user.ts': 'schemas/user.ts'

test:
  - name: 'Deploy Command'
    options:
      command: 'tsx --no-cache --tsconfig ./examples/tsconfig.json {entryPoint} deploy --env production --replicas 3'
    assertions:
      stdout:
        matches: '(?s)Deploying to production.*replicas: 3'

  - name: 'User Info Command'
    options:
      command: 'tsx --no-cache --tsconfig ./examples/tsconfig.json {entryPoint} user-info --email test@example.com --role admin'
    assertions:
      stdout:
        matches: '(?s)Email: test@example\.com.*Role: admin'
