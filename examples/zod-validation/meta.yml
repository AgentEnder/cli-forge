id: zod-validation
title: Zod Schema Validation
description: |
  Demonstrates how to use Zod schemas for argument validation and transformation.
  Schemas are defined in separate files, making them reusable across commands
  and testable in isolation.
test:
  - name: 'Deploy Command'
    options:
      command: 'npx tsx --no-cache --tsconfig ./examples/tsconfig.json examples/zod-validation/cli.ts deploy --env production --replicas 3'
    assertions:
      stdout:
        matches: '(?s)Deploying to production.*replicas: 3'

  - name: 'User Info Command'
    options:
      command: 'npx tsx --no-cache --tsconfig ./examples/tsconfig.json examples/zod-validation/cli.ts user-info --email test@example.com --role admin'
    assertions:
      stdout:
        matches: '(?s)Email: test@example\.com.*Role: admin'
