id: framework-comparison
title: Framework Comparison
description: |
  The same CLI implemented in multiple frameworks. A `greet` command with
  two subcommands (`hello` and `goodbye`), string options, and boolean
  flags — showing how each library approaches the same problem.
tags:
  - comparison

test:
  # ── cli-forge ──────────────────────────────────────────────
  - name: "cli-forge: hello"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json cli-forge.ts hello --name Alice --uppercase'
    assertions:
      stdout:
        contains: "HELLO, ALICE!"

  - name: "cli-forge: goodbye"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json cli-forge.ts goodbye --name Alice --formal'
    assertions:
      stdout:
        contains: "Farewell, Alice."

  # ── yargs ──────────────────────────────────────────────────
  - name: "yargs: hello"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json yargs.ts hello --name Alice --uppercase'
    assertions:
      stdout:
        contains: "HELLO, ALICE!"

  - name: "yargs: goodbye"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json yargs.ts goodbye --name Alice --formal'
    assertions:
      stdout:
        contains: "Farewell, Alice."

  # ── commander ──────────────────────────────────────────────
