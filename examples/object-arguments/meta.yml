id: object-arguments
title: Object Arguments with Defaults and Validation
description: |
  This example demonstrates how to work with object-valued options using dot-notation or JSON strings. Object options support:

  - **Nested properties**: Define complex configuration structures with type-safe nested objects
  - **Default values**: Provide defaults at any level (entire object or individual nested properties)
  - **Required properties**: Mark nested properties as required (only validated when parent object is present)
  - **Validation**: Validate the entire object or nested properties
  - **Coercion**: Transform the final object after parsing
  - **Additional properties**: Allow arbitrary properties with a specific type

  ## Dot Notation Syntax

  Object properties are accessed using dot notation on the command line:
  - `--config.server.host localhost` sets `config.server.host` to `"localhost"`
  - `--config.server.port 8080` sets `config.server.port` to `8080`
  - Multiple properties can be set independently

  ## JSON String Input

  Alternatively, you can pass the entire object as a JSON string:
  - `--config '{"server": {"host": "example.com", "port": 8080}}'`
  - JSON input can be mixed with dot notation
  - When mixed, the order matters (later values override earlier ones)

  ## Default Value Behavior

  - If no `config` properties are provided, the entire default object is used
  - If some properties are provided, defaults are applied for missing nested properties
  - Default values work at any nesting level

  ## Required Properties

  Required properties within objects are conditionally required:
  - If the parent object is not present at all, nested required properties are not checked
  - If the parent object is present (any property is set), nested required properties are validated

  For example, if `database.host` is marked as required:
  - `--config.server.port 8080` is valid (database config not present)
  - `--config.database.port 5432` is invalid (database config present but `host` is missing)

test:
  - name: "Default Configuration"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts'
    assertions:
      stdout:
        matches: 'Server will run at: http://localhost:3000.*Features: basic'

  - name: "Override Single Property"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts --config.server.port 8080'
    assertions:
      stdout:
        matches: 'Server will run at: http://localhost:8080.*Features: basic'

  - name: "Multiple Properties"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts --config.server.host example.com --config.server.port 443 --config.server.ssl true'
    assertions:
      stdout:
        matches: 'Server will run at: https://example\.com:443.*Features: basic'

  - name: "Required Properties"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts --config.database.host db.example.com --config.database.name myapp'
    assertions:
      stdout:
        matches: 'Database: myapp at db\.example\.com:5432.*Features: basic'

  - name: "Array Properties"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts --config.features api websockets admin'
    assertions:
      stdout:
        matches: 'Features: api, websockets, admin'

  - name: "JSON String Input"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts --config "{\"server\": {\"host\": \"api.example.com\", \"port\": 8443, \"ssl\": true}}"'
    assertions:
      stdout:
        matches: 'Server will run at: https://api\.example\.com:8443.*Features: basic'

  - name: "Mixed JSON and Dot Notation"
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json object-notation-cli.ts --config "{\"server\": {\"host\": \"mixed.example.com\"}}" --config.server.port 9000'
    assertions:
      stdout:
        matches: 'Server will run at: http://mixed\.example\.com:9000.*Features: basic'
