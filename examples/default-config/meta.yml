id: default-config
title: Default Config Path
hidden: true
description: |
  Demonstrates named locations + `defaultLocation` on configuration providers.
  When no config file exists on disk, `updateConfig` writes to the
  `defaultLocation` to create one. This enables `init` commands that bootstrap
  configuration from scratch.
test:
  - name: 'Creates config file at defaultLocation when none exists'
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json init-test.ts'
    assertions:
      stdout:
        contains: 'theme: dark'
  - name: 'Written config contains all updated values'
    options:
      command: 'npx tsx --no-cache --tsconfig ../tsconfig.json init-test.ts'
    assertions:
      stdout:
        contains: 'lang: fr'
