packages:
  - 'packages/*'
  - 'docs-site'

catalog:
  # Build tooling
  tslib: ^2.3.0
  typescript: 5.9.3

  # Nx and related
  nx: 22.1.3
  '@nx/eslint': 22.1.3
  '@nx/eslint-plugin': 22.1.3
  '@nx/js': 22.1.3
  '@nx/vite': 22.1.3
  '@nx/web': 22.1.3
  '@nx/workspace': 22.1.3
  nx-github-pages: ^1.0.0

  # SWC
  '@swc-node/register': ~1.9.1
  '@swc/core': ~1.5.7
  '@swc/helpers': ~0.5.11

  # TypeScript/ESLint
  '@typescript-eslint/eslint-plugin': ^7.16.0
  '@typescript-eslint/parser': ^7.16.0
  eslint: ~8.57.0
  eslint-config-prettier: 10.1.8

  # Testing
  '@types/jest': ^29.5.12
  jest: ^29.7.0
  ts-jest: ^29.2.5
  vitest: ^1.3.1
  '@vitest/coverage-v8': ^1.0.4
