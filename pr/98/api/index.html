        <script id="vike_pageContext" type="application/json">{"pageId":"\\/pages\\/api","routeParams":{},"data":{"packages":[{"dirName":"cli-forge","npmName":"cli-forge","description":"","version":"1.10.0","npmUrl":"https:\\/\\/www.npmjs.com\\/package\\/cli-forge","githubUrl":"https:\\/\\/github.com\\/AgentEnder\\/cli-forge\\/tree\\/main\\/packages\\/cli-forge","readmeContent":"# cli-forge\n\n**A type-safe CLI builder for Node.js with first-class TypeScript support.**\n\nCLI Forge is a modern framework for building command-line interfaces in Node.js, designed with TypeScript developers in mind. It provides full type inference for parsed arguments, automatic help generation, middleware support, and built-in documentation tooling.\n\n## Installation\n\n```bash\nnpm install cli-forge\n```\n\n## Quick Start\n\nCreate a new CLI project:\n\n```bash\nnpx cli-forge init my-cli\n```\n\nOr add to an existing project:\n\n```typescript\nimport { cli } from 'cli-forge';\n\ncli('my-app')\n  .command('hello', {\n    description: 'Say hello to someone',\n    builder: (args) =>\n      args.option('name', {\n        type: 'string',\n        description: 'Name to greet',\n        default: 'World',\n      }),\n    handler: (args) => {\n      console.log(`Hello, ${args.name}!`);\n    },\n  })\n  .forge();\n```\n\nRun it:\n\n```bash\nnode my-app.js hello --name \"Developer\"\n# Output: Hello, Developer!\n```\n\n## Key Features\n\n- **Full type inference** for parsed arguments based on your option definitions\n- **Flexible option types**: strings, numbers, booleans, arrays, and nested objects\n- **Command hierarchy** with unlimited nesting and inherited options\n- **Middleware system** for transforming arguments before handler execution\n- **Interactive shell** (opt-in) for easier exploration of complex command trees\n- **Automatic documentation generation** to markdown or JSON formats\n- **Configuration file support** with inheritance via `extends`\n- **Built-in test harness** for unit testing your CLI commands\n- **Rich validation** with custom validators, choices, and cross-option constraints\n\n## Option Types\n\n```typescript\ncli('app')\n  .option('name', { type: 'string' })\n  .option('port', { type: 'number', default: 3000 })\n  .option('verbose', { type: 'boolean', alias: ['v'] })\n  .option('tags', { type: 'array', items: 'string' })\n  .option('config', {\n    type: 'object',\n    properties: {\n      host: { type: 'string' },\n      timeout: { type: 'number' },\n    },\n  });\n```\n\n## Subcommands\n\n```typescript\ncli('git')\n  .command('remote', {\n    builder: (args) =>\n      args\n        .command('add', {\n          builder: (a) =>\n            a\n              .positional('name', { type: 'string' })\n              .positional('url', { type: 'string' }),\n          handler: (args) => {\n            console.log(`Adding remote ${args.name}: ${args.url}`);\n          },\n        })\n        .command('remove', {\n          builder: (a) => a.positional('name', { type: 'string' }),\n          handler: (args) => {\n            console.log(`Removing remote ${args.name}`);\n          },\n        }),\n  })\n  .forge();\n```\n\n## Middleware\n\nTransform arguments before they reach your handler:\n\n```typescript\ncli('app')\n  .middleware((args) => ({\n    ...args,\n    timestamp: Date.now(),\n  }))\n  .command('run', {\n    handler: (args) => {\n      console.log(`Started at: ${args.timestamp}`);\n    },\n  });\n```\n\n## Zod Validation\n\nOptional Zod integration for schema validation:\n\n```typescript\nimport { cli } from 'cli-forge';\nimport { zodMiddleware } from 'cli-forge\\/middleware\\/zod';\nimport { z } from 'zod';\n\ncli('app')\n  .option('port', { type: 'number' })\n  .middleware(\n    zodMiddleware(\n      z.object({\n        port: z.number().min(1).max(65535),\n      })\n    )\n  )\n  .forge();\n```\n\n## Interactive Shell\n\nEnable an interactive REPL for your CLI:\n\n```typescript\ncli('my-app')\n  .enableInteractiveShell()\n  .command('hello', { \\/* ... *\\/ })\n  .forge();\n```\n\n## Testing\n\nUse the built-in test harness:\n\n```typescript\nimport { TestHarness } from 'cli-forge';\nimport myCLI from '.\\/my-cli';\n\nconst harness = new TestHarness(myCLI);\n\nconst { args, commandChain } = await harness.parse(['hello', '--name', 'World']);\nassert.strictEqual(args.name, 'World');\nassert.deepStrictEqual(commandChain, ['hello']);\n```\n\n## Documentation Generation\n\nGenerate markdown or JSON documentation:\n\n```bash\nnpx cli-forge generate-docs .\\/my-cli.ts\nnpx cli-forge generate-docs .\\/my-cli.ts --format json\n```\n\n## Related Packages\n\n- [`@cli-forge\\/parser`](https:\\/\\/www.npmjs.com\\/package\\/@cli-forge\\/parser) - Low-level argument parser with type inference\n\n## Documentation\n\nFull documentation available at: https:\\/\\/craigory.dev\\/cli-forge\\/\n\n## License\n\nISC\n","renderedHtml":"\u003cp>\u003cstrong>A type-safe CLI builder for Node.js with first-class TypeScript support.\u003c\\/strong>\u003c\\/p>\n\u003cp>CLI Forge is a modern framework for building command-line interfaces in Node.js, designed with TypeScript developers in mind. It provides full type inference for parsed arguments, automatic help generation, middleware support, and built-in documentation tooling.\u003c\\/p>\n\u003ch2 id=\"installation\">Installation\u003ca class=\"heading-anchor\" aria-hidden=\"true\" tabindex=\"-1\" href=\"#installation\">\u003csvg xmlns=\"http:\\/\\/www.w3.org\\/2000\\/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\">\u003c\\/path>\u003cpath d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\">\u003c\\/path>\u003c\\/svg>\u003c\\/a>\u003c\\/h2>\n\u003cpre class=\"shiki forge\" style=\"background-color:#0d0906f2;color:#c4a882\" tabindex=\"0\">\u003ccode class=\"lan 3ca class=\"heading-anchor\" aria-hidden=\"true\" tabindex=\"-1\" href=\"#license\">\u003csvg xmlns=\"http:\\/\\/www.w3.org\\/2000\\/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\">\u003c\\/path>\u003cpath d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\">\u003c\\/path>\u003c\\/svg>\u003c\\/a>\u003c\\/h2>\n\u003cp>ISC\u003c\\/p>","headings":[{"id":"installation","text":"Installation","level":2},{"id":"quick-start","text":"Quick Start","level":2},{"id":"key-features","text":"Key Features","level":2},{"id":"option-types","text":"Option Types","level":2},{"id":"subcommands","text":"Subcommands","level":2},{"id":"middleware","text":"Middleware","level":2},{"id":"zod-validation","text":"Zod Validation","level":2},{"id":"interactive-shell","text":"Interactive Shell","level":2},{"id":"testing","text":"Testing","level":2},{"id":"documentation-generation","text":"Documentation Generation","level":2},{"id":"related-packages","text":"Related Packages","level":2},{"id":"documentation","text":"Documentation","level":2},{"id":"license","text":"License","level":2}]},{"dirName":"parser","npmName":"@cli-forge\\/parser","description":"","version":"1.10.0","npmUrl":"https:\\/\\/www.npmjs.com\\/package\\/@cli-forge\\/parser","githubUrl":"https:\\/\\/github.com\\/AgentEnder\\/cli-forge\\/tree\\/main\\/packages\\/parser","readmeContent":"# @cli-forge\\/parser\n\n**A type-safe argument parser for Node.js with full TypeScript inference.**\n\nThis is the low-level parsing engine that powers [cli-forge](https:\\/\\/www.npmjs.com\\/package\\/cli-forge). Use this package directly if you need fine-grained control over argument parsing without the higher-level command management features.\n\n## Installation\n\n```bash\nnpm install @cli-forge\\/parser\n```\n\n## Quick Start\n\n```typescript\nimport { parser } from '@cli-forge\\/parser';\n\nconst args = parser()\n  .option('name', { type: 'string', required: true })\n  .option('port', { type: 'number', default: 3000 })\n  .option('verbose', { type: 'boolean', alias: ['v'] })\n  .parse(['--name', 'my-app', '--port', '8080', '-v']);\n\n\\/\\/ args is fully typed:\n\\/\\/ { name: string; port: number; verbose: boolean }\nconsole.log(args.name);    \\/\\/ 'my-app'\nconsole.log(args.port);    \\/\\/ 8080\nconsole.log(args.verbose); \\/\\/ true\n```\n\n## Features\n\n- **Full TypeScript inference** - Types accumulate as you chain `.option()` calls\n- **Multiple option types** - `string`, `number`, `boolean`, `array`, `object`\n- **Value sources** - CLI args, environment variables, config files, defaults\n- **Validation** - `choices`, `validate`, `required`, `conflicts`, `implies`\n- **Config file support** - JSON\\/YAML with inheritance via `extends`\n- **Coercion** - Transform values during parsing\n\n## Option Types\n\n### String\n\n```typescript\nparser().option('name', {\n  type: 'string',\n  description: 'User name',\n  default: 'anonymous',\n});\n```\n\n### Number\n\n```typescript\nparser().option('port', {\n  type: 'number',\n  description: 'Port number',\n  default: 3000,\n});\n```\n\n### Boolean\n\n```typescript\nparser().option('verbose', {\n  type: 'boolean',\n  alias: ['v'],\n  description: 'Enable verbose output',\n});\n\\/\\/ Supports: --verbose, --verbose true, --no-verbose\n```\n\n### Array\n\n```typescript\nparser().option('files', {\n  type: 'array',\n  items: 'string',\n  description: 'Input files',\n});\n\\/\\/ Supports: --files a b c, --files a,b,c, --files a --files b\n```\n\n### Object\n\n```typescript\nparser().option('config', {\n  type: 'object',\n  properties: {\n    host: { type: 'string', default: 'localhost' },\n    port: { type: 'number', required: true },\n    ssl: { type: 'boolean' },\n  },\n});\n\\/\\/ Supports: --config.host example.com --config.port 443 --config.ssl\n```\n\n## Positional Arguments\n\n```typescript\nparser()\n  .positional('input', { type: 'string', required: true })\n  .positional('output', { type: 'string' })\n  .parse(['input.txt', 'output.txt']);\n```\n\n## Validation\n\n### Choices\n\n```typescript\nparser().option('level', {\n  type: 'string',\n  choices: ['debug', 'info', 'warn', 'error'],\n});\n```\n\n### Custom Validation\n\n```typescript\nparser().option('port', {\n  type: 'number',\n  validate: (value) => {\n    if (value \u003c 1 || value > 65535) {\n      throw new Error('Port must be between 1 and 65535');\n    }\n    return true;\n  },\n});\n```\n\n### Conflicts and Implies\n\n```typescript\nparser()\n  .option('quiet', { type: 'boolean' })\n  .option('verbose', {\n    type: 'boolean',\n    conflicts: ['quiet'],\n  })\n  .option('output', {\n    type: 'string',\n    implies: { format: 'json' },\n  });\n```\n\n## Environment Variables\n\n```typescript\nparser().option('apiKey', {\n  type: 'string',\n  env: 'API_KEY',\n});\n\\/\\/ Will read from process.env.API_KEY if --apiKey not provided\n```\n\n## Configuration Files\n\n```typescript\nparser()\n  .configFile('myapp.config.json')\n  .option('port', { type: 'number' })\n  .parse([]);\n```\n\nConfig files support inheritance:\n\n```json\n{\n  \"extends\": \".\\/base-config.json\",\n  \"port\": 8080\n}\n```\n\n## Coercion\n\nTransform values during parsing:\n\n```typescript\nparser().option('date', {\n  type: 'string',\n  coerce: (value) => new Date(value),\n});\n```\n\n## Type Inference\n\nThe parser tracks types as options are added:\n\n```typescript\nconst p = parser()\n  .option('name', { type: 'string' })        \\/\\/ { name?: string }\n  .option('port', { type: 'number' })        \\/\\/ { name?: string; port?: number }\n  .option('required', { type: 'string', required: true }); \\/\\/ { name?: string; port?: number; required: string }\n```\n\n## Related Packages\n\n- [`cli-forge`](https:\\/\\/www.npmjs.com\\/package\\/cli-forge) - High-level CLI builder with commands, middleware, and documentation generation\n\n## Documentation\n\nFull documentation available at: https:\\/\\/craigory.dev\\/cli-forge\\/\n\n## License\n\nISC\n","renderedHtml":"\u003cp>\u003cstrong>A type-safe argument parser for Node.js with full TypeScript inference.\u003c\\/strong>\u003c\\/p>\n\u003cp>This is the low-level parsing engine that powers \u003ca href=\"https:\\/\\/www.npmjs.com\\/package\\/cli-forge\">cli-forge\u003c\\/a>. Use this package directly if you need fine-grained control over argument parsing without the higher-level command management features.\u003c\\/p>\n\u003ch2 id=\"installation\">Installation\u003ca class=\"heading-anchor\" aria-hidden=\"true\" tabindex=\"-1\" href=\"#installation\">\u003csvg xmlns=\"http:\\/\\/www.w3.org\\/2000\\/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\">\u003c\\/path>\u003cpath d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\">\u003c\\/path>\u003c\\/svg>\u003c\\/a>\u003c\\/h2>\n\u003cpre class=\"shiki forge\" style=\"background-color:#0d0906f2;color:#c4a882\" tabindex=\"0\">\u003ccode class=\"language-bash\">\u003cspan class=\"line\">\u003cspan style=\"color:#E8C090\">npm\u003c\\/span>\u003cspan style=\"color:#FFB347\"> install\u003c\\/span>\u003cspan style=\"color:#FFB347\"> @\u003c\\/span>\u003ca href=\"\\/cli-forge\\/pr\\/98\\/api\\/cli-forge\\/cli-function\" class=\"typedoc-link\">\u003cspan style=\"color:#FFB347\">cli\u003c\\/span>\u003c\\/a>\u003cspan style=\"color:#FFB347\">-forge\\/\u003c\\/span>\u003ca href=\"\\/cli-forge\\/pr\\/98\\/api\\/parser\\/parser\" class=\"typedoc-link\">\u003cspan style=\"color:#FFB347\">parser\u003c\\/span>\u003c\\/a>\u003c\\/span>\u003c\\/code>\u003c\\/pre>\n\u003ch2 id=\"quick-start\">Quick Start\u003ca class=\"heading-anchor\" aria-hidden=\"true\"
