extends: capitalization
message: "Use sentence case for headings. '%s' should be '%s'."
level: error
scope: heading
match: $sentence
indicators:
  - ':'
exceptions:
  # Project-specific
  - CLI
  - API
  - APIs
  - TypeScript
  - JavaScript
  - Node.js
  - JSON
  - YAML
  - TOML
  - CSS
  - HTML
  # Tools and frameworks
  - GitHub
  - GitHub Actions
  - ESLint
  - Prettier
  - Zod
  - Vitest
  - Jest
  - Docusaurus
  - Vike
  - React
  - npm
  - pnpm
  - Yarn
  - Forge
  - yargs
  - commander
  - oclif
  - clipanion
  - cac
  - meow
  - citty
  - cleye
  - gluegun
  - util.parseArgs
  - effect
  # Abbreviations
  - AI
  - CI
  - CD
  - URL
  - URLs
  - PR
  - PRs
  - IDE
  - IDEs
  - SSR
  - SSG
  - E2E
  - REPL
  # API identifiers that must keep their casing
  - parseArgs
