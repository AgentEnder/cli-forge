StylesPath = .vale/styles
MinAlertLevel = suggestion

[docs/**/*.md]
BasedOnStyles = CliForge
# Ignore inline code to avoid false positives
TokenIgnores = (`[^`]+`)

# Auto-generated CLI reference pages use option/command names as headings
[docs/cli/**/*.md]
CliForge.Headings = NO

# Built docs include rendered example descriptions and generated pages
# Headings rule is disabled because generated HTML uses code identifiers (API type
# names, CLI option names, page titles) as headings that cannot follow sentence case.
[dist/client/**/*.html]
BasedOnStyles = CliForge
CliForge.Headings = NO
